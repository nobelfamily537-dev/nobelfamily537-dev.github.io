name: Refresh latest posts on homepage
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate latest.json from blog + space
        run: python3 scripts/gen_latest.py --remote --static
      - name: Commit if changed
        run: |
          git config user.name "anipix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json index.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh latest posts from blog + space"
            git push
          fi
